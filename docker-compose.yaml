version: '3.9'

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: medbot_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medbot_redis
    restart: always
    networks:
      - medbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django ASGI Web Server ───────────────────────────────────────────────────
  web:
    build: .
    container_name: medbot_web
    restart: always
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             uvicorn asgi_uk_medical_bot.asgi:application --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - medbot-network

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    build: .
    container_name: medbot_celery
    restart: always
    env_file: .env
    command: celery -A asgi_uk_medical_bot worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medbot-network

  # ─── Celery Beat (Scheduler) ─────────────────────────────────────────────────
  celery-beat:
    build: .
    container_name: medbot_celery_beat
    restart: always
    env_file: .env
    command: celery -A asgi_uk_medical_bot beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medbot-network

volumes:
  postgres_data:
  static_files:
  media_files:

networks:
  medbot-network:
    driver: bridge
